name: Windows release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/windows-release.yml', 'src-tauri/**', 'ui/**', 'rules.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Test Windows core
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Test weekly summary
        run: node --test tests/hydration-week.test.mjs
      - name: Build Chinese Windows installer
        shell: pwsh
        run: |
          npm install --global @tauri-apps/cli@2.11.4
          '{"bundle":{"createUpdaterArtifacts":false,"windows":{"nsis":{"languages":["SimpChinese"],"displayLanguageSelector":false,"installMode":"currentUser"}}}}' | Set-Content -Encoding utf8 windows-build.json
          tauri build --bundles nsis --config windows-build.json
      - name: Verify and publish installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $files = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe)
          if ($files.Count -ne 1) { throw 'Expected one Windows installer' }
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          $asset = "dist/windows/Mickey-v$version-windows-x86_64-setup.exe"
          Copy-Item $files[0].FullName $asset
          $bytes = [IO.File]::ReadAllBytes($asset)
          if ($bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) { throw 'Installer is not a Windows executable' }
          Get-FileHash $asset -Algorithm SHA256
          gh release view "v$version" --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) {
            gh release create "v$version" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --draft --title "米奇 v$version" --notes-file "docs/RELEASE_$version.md"
            if ($LASTEXITCODE -ne 0) { throw 'Release draft creation failed' }
          }
          # Replacing a published installer would invalidate its updater signature.
          gh release upload "v$version" $asset --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: Mickey-Windows-x86_64
          path: dist/windows/*.exe
          retention-days: 14
